<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Conectando con MIMI Partners...</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #102033;
    }

    main {
      width: min(360px, calc(100vw - 32px));
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 18px;
      border: 4px solid #d7e2ef;
      border-top-color: #16784d;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: #607084;
      font-size: 14px;
      line-height: 1.5;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Conectando con MIMI Partners</h1>
    <p>Estamos terminando el ingreso de prestador con Google.</p>
  </main>

  <script src="./env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { getCurrentSession } from "./src/services/supabase.js";

    const mode = "provider";
    const target = "./prestador.html";

    try {
      sessionStorage.setItem("mimi_services_active_mode", mode);
      localStorage.setItem("mimi_services_active_mode", mode);
      sessionStorage.setItem("mimi_services_auth_redirect_in_progress", "prestador.html");
      sessionStorage.setItem("mimi_services_auth_intent", mode);
      localStorage.setItem("mimi_services_auth_intent", mode);
    } catch (_) {}

    async function finishAuth() {
      try {
        await getCurrentSession();
      } catch (error) {
        console.warn("[MIMI provider auth callback] session recovery warning:", error);
      }

      window.location.replace(target);
    }

    finishAuth();
  </script>
</body>
</html>
