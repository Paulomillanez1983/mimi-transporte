<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163867">
  <meta name="description" content="MIMI Servicios. Elegí si querés entrar como cliente o prestador.">
  <title>MIMI Servicios</title>

  <style>
    :root {
      --bg: #edf4ff;
      --surface: rgba(255,255,255,.94);
      --text: #13233f;
      --muted: #5e6f8f;
      --primary: #1e3c72;
      --green: #18a058;
      --shadow: 0 22px 60px rgba(17,41,86,.14);
      --radius: 28px;
      --font-body: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(91,156,255,.22), transparent 28%),
        radial-gradient(circle at top right, rgba(43,182,115,.16), transparent 24%),
        linear-gradient(180deg, #f6f9ff 0%, #edf4ff 48%, #e7eefc 100%);
    }

    .gate-card {
      width: min(520px, 100%);
      padding: 28px 22px;
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(30,60,114,.09);
      color: var(--primary);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(2rem, 7vw, 2.7rem);
      line-height: 1;
      color: var(--primary);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .role-grid {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    .role-btn {
      width: 100%;
      border: 0;
      border-radius: 22px;
      padding: 18px;
      text-align: left;
      background: #fff;
      box-shadow: 0 12px 30px rgba(17,41,86,.08);
      cursor: pointer;
      display: grid;
      gap: 5px;
      color: var(--text);
    }

    .role-btn strong {
      font-size: 18px;
      color: var(--primary);
    }

    .role-btn span {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
    }

    .role-btn.provider {
      background: linear-gradient(135deg, #13233f, #1e3c72);
      color: #fff;
    }

    .role-btn.provider strong,
    .role-btn.provider span {
      color: #fff;
    }

    .helper {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="gate-card">
    <span class="badge">MIMI Servicios</span>
    <h1>¿Cómo querés entrar?</h1>
    <p>
      Elegí tu experiencia. Después podés iniciar sesión con Google y la app abrirá el panel correcto.
    </p>

    <div class="role-grid">
      <button class="role-btn client" id="enterClient" type="button">
        <strong>Entrar como Cliente</strong>
        <span>Solicitar servicios, ver prestadores, cotizar, chatear y seguir el estado.</span>
      </button>

      <button class="role-btn provider" id="enterProvider" type="button">
        <strong>Entrar como Prestador</strong>
        <span>Recibir solicitudes, verificar identidad, gestionar disponibilidad y servicios.</span>
      </button>
    </div>

    <p class="helper" id="gateHelper">
      Tu elección se guarda sólo para abrir la pantalla correcta.
    </p>

    <noscript>
      <p class="helper">Necesitás habilitar JavaScript para continuar.</p>
    </noscript>
  </main>

  <script>
    function setModeAndGo(mode) {
      try {
        localStorage.setItem("mimi_services_active_mode", mode);
        sessionStorage.setItem("mimi_services_active_mode", mode);
      } catch (_) {}

      window.location.href = mode === "provider"
        ? "./prestador.html"
        : "./cliente.html";
    }

    document.getElementById("enterClient")?.addEventListener("click", () => {
      setModeAndGo("client");
    });

    document.getElementById("enterProvider")?.addEventListener("click", () => {
      setModeAndGo("provider");
    });
  </script>
</body>
</html>
