<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Conectando con MIMI Servicios...</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const requestedRole = params.get("appRole") || params.get("mode");
      const hasFreshProviderAuthLock = () => {
        const read = (storage) => {
          const raw = storage.getItem("mimi_services_provider_auth_lock");
          if (!raw) return false;

          try {
            const payload = JSON.parse(raw);
            const startedAt = Number(payload?.startedAt || 0);
            return payload?.mode === "provider" && startedAt > 0 && Date.now() - startedAt <= 15 * 60 * 1000;
          } catch (_) {
            storage.removeItem("mimi_services_provider_auth_lock");
            return false;
          }
        };

        try {
          return read(sessionStorage) || read(localStorage);
        } catch (_) {
          return false;
        }
      };

      let providerIntent = requestedRole === "provider";

      try {
        providerIntent = providerIntent || hasFreshProviderAuthLock();
      } catch (_) {}

      if (!providerIntent) return;

      try {
        sessionStorage.setItem("mimi_services_active_mode", "provider");
        localStorage.setItem("mimi_services_active_mode", "provider");
        sessionStorage.setItem("mimi_services_auth_redirect_in_progress", "prestador.html");
        sessionStorage.setItem("mimi_services_auth_intent", "provider");
        localStorage.setItem("mimi_services_auth_intent", "provider");
        const lock = JSON.stringify({ mode: "provider", target: "prestador.html", recoveredFrom: "auth-callback-head", startedAt: Date.now() });
        sessionStorage.setItem("mimi_services_provider_auth_lock", lock);
        localStorage.setItem("mimi_services_provider_auth_lock", lock);
        const registerIntent = JSON.stringify({ mode: "provider", source: "auth-callback-head", startedAt: Date.now() });
        sessionStorage.setItem("mimi_services_provider_registration_intent", registerIntent);
        localStorage.setItem("mimi_services_provider_registration_intent", registerIntent);
        sessionStorage.removeItem("mimi_services_client_auth_lock");
        localStorage.removeItem("mimi_services_client_auth_lock");
      } catch (_) {}

      const providerCallback = new URL("./auth-provider-callback.html", window.location.href);
      for (const [key, value] of params.entries()) {
        providerCallback.searchParams.set(key, value);
      }
      providerCallback.searchParams.set("appRole", "provider");
      providerCallback.searchParams.set("returnTo", "/prestador");
      providerCallback.searchParams.set("target", "prestador.html");
      window.location.replace(`${providerCallback.pathname}${providerCallback.search}${window.location.hash || ""}`);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #102033;
    }

    main {
      width: min(360px, calc(100vw - 32px));
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 18px;
      border: 4px solid #d7e2ef;
      border-top-color: #16784d;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: #607084;
      font-size: 14px;
      line-height: 1.5;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Conectando con MIMI Servicios</h1>
    <p>Estamos terminando el ingreso con Google.</p>
  </main>

  <script src="./env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { getCurrentSession, markProviderRegistrationIntent } from "./src/services/supabase.js?v=2026.06.05.2";

    const params = new URLSearchParams(window.location.search);
    const requestedRole = params.get("appRole") || params.get("mode");
    const hasFreshProviderAuthLock = () => {
      const read = (storage) => {
        const raw = storage.getItem("mimi_services_provider_auth_lock");
        if (!raw) return false;

        try {
          const payload = JSON.parse(raw);
          const startedAt = Number(payload?.startedAt || 0);
          return payload?.mode === "provider" && startedAt > 0 && Date.now() - startedAt <= 15 * 60 * 1000;
        } catch (_) {
          storage.removeItem("mimi_services_provider_auth_lock");
          return false;
        }
      };

      try {
        return read(sessionStorage) || read(localStorage);
      } catch (_) {
        return false;
      }
    };
    const providerIntent = (() => {
      try {
        return requestedRole === "provider" || hasFreshProviderAuthLock();
      } catch (_) {
        return requestedRole === "provider";
      }
    })();

    if (providerIntent) {
      try {
        sessionStorage.setItem("mimi_services_active_mode", "provider");
        localStorage.setItem("mimi_services_active_mode", "provider");
        sessionStorage.setItem("mimi_services_auth_redirect_in_progress", "prestador.html");
        sessionStorage.setItem("mimi_services_auth_intent", "provider");
        localStorage.setItem("mimi_services_auth_intent", "provider");
        const lock = JSON.stringify({ mode: "provider", target: "prestador.html", recoveredFrom: "client-callback", startedAt: Date.now() });
        sessionStorage.setItem("mimi_services_provider_auth_lock", lock);
        localStorage.setItem("mimi_services_provider_auth_lock", lock);
        markProviderRegistrationIntent("client_callback_provider_redirect");
        sessionStorage.removeItem("mimi_services_client_auth_lock");
        localStorage.removeItem("mimi_services_client_auth_lock");
      } catch (_) {}

      const providerCallback = new URL("./auth-provider-callback.html", window.location.href);
      for (const [key, value] of params.entries()) {
        providerCallback.searchParams.set(key, value);
      }
      providerCallback.searchParams.set("appRole", "provider");
      providerCallback.searchParams.set("returnTo", "/prestador");
      providerCallback.searchParams.set("target", "prestador.html");
      window.location.replace(`${providerCallback.pathname}${providerCallback.search}${window.location.hash || ""}`);
    } else {
      const allowedClientReturnTo = new Set([
        "/cliente",
        "/servicios",
        "/mimi-servicios/cliente.html"
      ]);
      const requestedReturnTo = String(params.get("returnTo") || "");
      const mode = "client";
      const target = allowedClientReturnTo.has(requestedReturnTo) && requestedReturnTo !== "/mimi-servicios/cliente.html"
        ? requestedReturnTo
        : "/servicios";

      try {
        sessionStorage.setItem("mimi_services_active_mode", mode);
        localStorage.setItem("mimi_services_active_mode", mode);
        sessionStorage.setItem("mimi_services_auth_redirect_in_progress", "cliente.html");
        sessionStorage.setItem("mimi_services_auth_intent", mode);
        localStorage.setItem("mimi_services_auth_intent", mode);
      } catch (_) {}

      async function finishAuth() {
        let session = null;
        try {
          session = await getCurrentSession();
        } catch (error) {
          console.warn("[MIMI servicios auth callback] session recovery warning:", error);
        }

        if (!session?.user) {
          const fallback = new URL("/servicios", window.location.origin);
          fallback.searchParams.set("auth_error", "session");
          window.location.replace(fallback.toString());
          return;
        }

        window.location.replace(target);
      }

      finishAuth();
    }
  </script>
</body>
</html>
