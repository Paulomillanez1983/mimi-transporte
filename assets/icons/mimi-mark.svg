<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MIMI GO app icon</title>
  <desc id="desc">Black MIMI GO icon with white premium wordmark.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="54%">
      <stop offset="0" stop-color="#1f2937" stop-opacity="0.9"/>
      <stop offset="0.58" stop-color="#050505" stop-opacity="1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <rect x="18" y="18" width="476" height="476" rx="104" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
  <g fill="#ffffff" filter="url(#softShadow)" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <text x="256" y="232" font-size="94" letter-spacing="2">MIMI</text>
    <text x="256" y="326" font-size="98" letter-spacing="1">GO</text>
  </g>
</svg>
